<!DOCTYPE html>
<html lang="en">
<head>
    <title>Small website with Bootstrap and JQuery</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container-fluid bg-primary text-white text-center p-5">
    <h1>Introduce tu nombre de GITHUB:</h1>
    <p>¡Aseguráte de que está escrito correctamente!</p>
</div>
<div class="container mt-5 ">
    <!--<h3> Introduzca aqui su nombre: </h3>-->
    <label for="username">GitHub Username: </label>
    <div class = "mb-3 mt-3">
        <input type="text" id="username" placeholder="Enter username" class = "form-control">
        <button type="button" class="btn btn-primary">Submit</button>
    </div>
</div>
</body>
</html>
