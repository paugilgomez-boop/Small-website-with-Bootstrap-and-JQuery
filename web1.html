<!DOCTYPE html>
<html lang="en">
<head>
    <title>Small website with Bootstrap and JQuery</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script>
$(document).ready(function(){

    $("#ShowGrid").click(function(){

        $.get("https://api.github.com/users/" + $("#username").val() + "/repos",function(data, status){
                $("#repoTable").empty();

                data.forEach(function(repo){
                        $("#repoTable").append(`
                        <tr>
                            <td>${repo.name}</td>
                            <td>${repo.description}</td>
                            <td>${repo.stargazers_count}</td>
                        </tr>
                        `)
                });
                alert("Nombre: " + $("#username").val() + "\nStatus: " + status + "\nRepos recibidos: " + data.length);
            }
        );

    });

});
    </script>
</head>
<body>
<div class="container-fluid bg-primary text-white text-center p-5">
    <h1>GitHub Repo Viewer</h1>
    <p>Pon tu nombre de usuario en GitHub y verás un listado de tus repositorios</p>
</div>
<div class="container-fluid bg-light p-5 mt-5">
    <h3> Introduzca aquí su nombre de usuario: </h3>
    <div class = "mb-3 mt-3">
        <label for="username">GitHub Username: </label>
        <input type="text" class = "form-control" id="username" placeholder="Enter username">
        <div class = "mb-3 mt-3">
            <button id = "ShowGrid" type="button" class="btn btn-primary">Show</button>
        </div>
    </div>
</div>
<div class="container-fluid mt-2 p-5">
    <h3>Table of Repos</h3>
    <p>Basic information of your repos.</p>
    <table class="table table-striped">
        <thead>
           <tr>
               <th>Name</th>
               <th>Description</th>
               <th>Number of followers</th>
           </tr>
        </thead>
        <tbody id = "repoTable">

        </tbody>
    </table>
</div>
</body>
</html>
