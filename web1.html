<!DOCTYPE html>
<html lang="en">
<head>
    <title>Small website with Bootstrap and JQuery</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container-fluid bg-primary text-white text-center p-5">
    <h1>GitHub Repo Viewer</h1>
    <p>Pon tu nombre de usuario en GitHub y verás un listado de tus repositorios.</p>
</div>
<div class="container bg-light p-5 mt-5 ms-5 w-50">
    <h3> Introduzca aqui su nombre de usuario: </h3>
    <div class = "mb-3 mt-3">
        <label for="username">GitHub Username: </label>
        <input type="text" id="username" placeholder="Enter username">
        <div class = "mb-3 mt-3">
            <button type="button" class="btn btn-primary">Show</button>
        </div>
    </div>
</div>
</body>
</html>
